services:
  # Django Backend
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.linux
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/Images
    env_file:
      - ./backend/docker.linux.env
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=1433
      - DATABASE_ENGINE=mssql
      - DATABASE_PASSWORD=ChangeMe_Dev123!
      - DATABASE_USER=sa
      - DATABASE_OPTIONS=driver=ODBC Driver 18 for SQL Server;TrustServerCertificate=yes;Encrypt=no; 
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000,http://frontend:3000,http://0.0.0.0:*
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - PYTHONPATH=/app
      - DJANGO_SETTINGS_MODULE=backend.settings
      - FRONTEND_URL=http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - neqat-network
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000

  # SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU12-ubuntu-20.04
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=ChangeMe_Dev123!
      - SA_PASSWORD=ChangeMe_Dev123!
      - MSSQL_PID=Express
      - MSSQL_TCP_PORT=1433
    volumes:
      - db_data:/var/opt/mssql
      - ./db-init.sql:/docker-entrypoint-initdb.d/db-init.sql
    ports:
      - "1433:1433"
    networks:
      - neqat-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "ChangeMe_Dev123!" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    # Linux-specific: Add container_name for easier access
    container_name: neqat-db-linux

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=ChangeMe_Dev123!
      - KC_DB=dev-file
      - KC_FEATURES=admin-fine-grained-authz,preview
      - KC_HTTP_RELATIVE_PATH=/
      - KC_PROXY=edge
      - KC_HOSTNAME_STRICT=false
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_ENABLED=true
      - KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_REQUEST_REUSE_CONNECTIONS=true
      - KC_SPI_CONNECTIONS_HTTP_CLIENT_DEFAULT_DISABLE_COOKIE_CACHE=true
      - KC_SPI_LOGIN_PROTOCOL_OPENID_CONNECT_LEGACY_LOGOUT_REDIRECT_URI=true
      - KC_SPI_THEME_STATIC_MAX_AGE=-1
      - KC_SPI_THEME_CACHE_THEMES=false
      - KC_SPI_THEME_CACHE_TEMPLATES=false
      - KC_CORS=true
      - KC_CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000,http://localhost:*,https://localhost:*,http://127.0.0.1:*,http://0.0.0.0:*,https://0.0.0.0:*
      - KC_CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS
      - KC_CORS_ALLOWED_HEADERS=*
      - KC_HTTP_ENABLED=true
      # Email settings config (needs to be properly configured through admin console)
      - KC_SPI_EMAIL_TEMPLATE_FROM=noreply@neqat.com
      - KC_SPI_EMAIL_TEMPLATE_FROM_DISPLAY_NAME=Neqat
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realm-export.json:/opt/keycloak/data/import/realm.json
    command:
      - start-dev
      - --import-realm
    ports:
      - "8080:8080"
    networks:
      - neqat-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Linux-specific: Add container_name for easier access
    container_name: neqat-keycloak-linux

  # Flutter Frontend
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile.linux
    volumes:
      - ./frontend:/app
    env_file:
      - ./frontend/api.linux.env
    environment:
      - django_api=http://localhost:8000
      - KEYCLOAK_URL=http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - keycloak
    networks:
      - neqat-network
    restart: unless-stopped
    # Linux-specific: Add container_name for easier access
    container_name: neqat-frontend-linux

volumes:
  db_data:
    name: neqat-db-data-linux
  static_volume:
    name: neqat-static-linux
  media_volume:
    name: neqat-media-linux
  keycloak_data:
    name: neqat-keycloak-data-linux

networks:
  neqat-network:
    driver: bridge
    name: neqat-network-linux 