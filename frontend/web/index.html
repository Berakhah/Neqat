<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frontend">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Security headers for social login -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline'; connect-src * 'self'; img-src * 'self' data: https:; style-src 'self' 'unsafe-inline'; media-src *; frame-src *;">
  <meta http-equiv="Referrer-Policy" content="no-referrer-when-downgrade">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>frontend</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = {{flutter_service_worker_version}};
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
  
  <!-- Script to handle social login redirects -->
  <script>
    window.addEventListener('load', function() {
      // Check if the URL contains tokens from social login
      const url = new URL(window.location.href);
      const accessToken = url.searchParams.get('access_token');
      const refreshToken = url.searchParams.get('refresh_token');
      const expiresIn = url.searchParams.get('expires_in');
      
      if (accessToken && refreshToken) {
        // Construct the callback URL with the neqat:// scheme
        const callbackUrl = `neqat://login?access_token=${accessToken}&refresh_token=${refreshToken}&expires_in=${expiresIn || ''}`;          
        // Store the URL for the Flutter app to retrieve
        localStorage.setItem('social_login_callback', callbackUrl);
        console.log('Social login callback stored:', callbackUrl);
      }
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
