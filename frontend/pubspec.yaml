name: frontend
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # Added for localization
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shimmer: ^3.0.0
  vector_graphics: ^1.1.18
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  openfoodfacts: ^3.21.0
  flutter_svg: ^2.0.17
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.1
  cached_network_image: ^3.4.1
  http: ^1.3.0
  barcode_scan2: ^4.5.1
  webview_flutter: ^4.10.0
  webview_flutter_web: ^0.2.3+4
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1
  rive_animated_icon: ^2.0.5
  logger: ^2.5.0
  flutter_secure_storage: ^9.2.4
  share_plus: ^10.1.4
  intl: ^0.19.0
  dio: ^5.4.1
  dartz: ^0.10.1
  image_picker: ^1.0.7
  js: ^0.6.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8
  test: ^1.24.9

flutter:
  uses-material-design: true

  assets:
    - images/
    - images/neqat_logo/
    - api.env

  # Enable localization code generation
  generate: true

flutter_intl:
  enabled: true
  localizations_delegates:
    - GlobalMaterialLocalizations.delegate
    - GlobalWidgetsLocalizations.delegate
    - GlobalCupertinoLocalizations.delegate
  supported_locales:
    - en
    - am
  arb_dir: lib/l10n
  template_arb_file: app_en.arb
  output_localization_file: app_localizations.dart
